# Runs the linter, the tests and a web build on every push to main and every pull request.
#
# The tests run in several timezones on purpose. A day is not always 24 hours on the days the clocks
# change, and several date bugs in this app only showed up in a timezone with daylight saving, which a
# developer's machine (or a plain UTC server) would never reveal.
#
# The build is the same command Netlify runs. Without it a broken bundle, a bad import path or a
# problem in patch-dist.js only shows up when Netlify fails, after the push.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: nothing here needs the native modules' install scripts.
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Europe/London, America/Los_Angeles, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      # build:web copies these in after the export; a missing one means a step in the script broke.
      - name: Check the build output
        run: |
          for f in index.html service-worker.js manifest.json icon.png apple-touch-icon.png apple-touch-icon-152.png apple-touch-icon-120.png; do
            test -s "dist/$f" || { echo "dist/$f is missing or empty"; exit 1; }
          done
          # Without a real manifest, Netlify's catch-all redirect answers /manifest.json with index.html.
          node -e "const m = JSON.parse(require('fs').readFileSync('dist/manifest.json', 'utf8')); if (!m.name || !m.start_url || !(m.icons || []).length) { console.error('dist/manifest.json is incomplete'); process.exit(1); }"
          # The service worker must be stamped with this build (see patch-dist.js), or old caches are never cleaned.
          grep -Eq "const CACHE = 'musiclog-[0-9a-f]{10}'" dist/service-worker.js || { echo "dist/service-worker.js is not stamped with a build id"; exit 1; }
          test -n "$(find dist -name '*.js' ! -name service-worker.js | head -1)" || { echo "no JavaScript bundle in dist"; exit 1; }

      # Opens the built app in a real browser: it draws and throws nothing, the manifest and service worker
      # are right, stored data survives a reload, and it opens offline (tests/e2e/smoke.mjs).
      # Playwright is installed here only, so package.json and the lockfile stay as they are.
      - name: Smoke test the built app
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/e2e/smoke.mjs dist
